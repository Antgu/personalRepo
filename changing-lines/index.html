<title>Changing Lines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one portrait column, night-ink ground; techniques are rice-paper slips; cinnabar seal for emphasis. */
:root{
  --ink:#10121a; --panel:#181b25; --panel2:#212533; --rule:#2d3242;
  --fg:#ebe4d4; --mute:#8f94a6;
  --paper:#e7dec9; --paper-ink:#221e18; --paper-mute:#6c6555;
  --cin:#cc4a30; --gold:#cfa64a; --jade:#4fae8f; --azure:#7097dc; --plum:#8c7699; --stone:#7d8394;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-brush:'Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.3;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:560px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;display:flex;flex-direction:column;gap:10px}
.zh{font-family:var(--f-brush);font-weight:400}
.mute{color:var(--mute)}
.btn{background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:15px}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--cin);border-color:var(--cin);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--gold);color:var(--gold)}

/* hexagram lines */
.hex{--w:34px;--h:4px;display:flex;flex-direction:column;gap:calc(var(--h)*.6);width:var(--w);color:inherit}
.hex .ln{display:flex;gap:calc(var(--w)*.18);height:var(--h)}
.hex .ln i{flex:1;background:currentColor;border-radius:1px;transition:background .2s}
.hex.big{--w:132px;--h:14px;color:var(--fg)}
.hex.mid{--w:64px;--h:7px}
.hex.sm{--w:26px;--h:3px}
.hex .ln.chg i{background:var(--tc,var(--gold));box-shadow:0 0 10px var(--tc,var(--gold));animation:pulse 1s ease-in-out infinite alternate}
.hex .ln.flip i{animation:flip .55s ease-out}
.hex .ln.tap{cursor:pointer;padding-block:3px;margin-block:-3px}
.hex .ln.tap:hover i{background:var(--gold)}
.hex .ln.pick i{background:var(--jade)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes flip{0%{transform:scaleX(.2);background:var(--gold)}100%{transform:scaleX(1)}}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.road{display:flex;gap:6px;align-items:center}
.road span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule);font-size:15px;color:var(--mute)}
.road span.now{border-color:var(--gold);color:var(--gold)}
.road span.done{background:var(--panel2);color:var(--fg)}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--rule);border-radius:6px;padding:4px 9px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}

/* bars */
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--cin);transition:width .3s}
.bar.me b{background:var(--jade)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:13px;padding:1px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--rule);white-space:nowrap}
.chip.blk{color:var(--azure)}.chip.str{color:var(--cin)}.chip.burn{color:#e7863a}.chip.good{color:var(--jade)}.chip.gold{color:var(--gold)}

/* foe */
.foe{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;position:relative}
.foe.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.foe h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
.foe .school{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.foe .left{display:flex;flex-direction:column;gap:6px;min-width:0}
.intent{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px 10px}
.intent .what{font-weight:700;font-size:17px}
.intent.cut .what{text-decoration:line-through;text-decoration-color:var(--jade)}
.fstance{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);text-align:center;width:92px}
.fstance .zh{font-size:22px;color:var(--fg);line-height:1}
.counterhint{font-size:12px;color:var(--mute)}
.counterhint b{color:var(--jade);font-weight:600}

/* stance */
.stance{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:4px}
.stance .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.stance .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stance .name{text-align:center;line-height:1.1}
.stance .name .zh{font-size:26px}
.stance .name small{display:block;color:var(--mute);font-size:13px}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.side.r{align-items:flex-end;text-align:right}
.qi{display:flex;gap:4px}
.qi i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold)}
.qi i.f{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.mom{font-size:15px}
.mom .zh{font-size:30px;color:var(--cin);vertical-align:-4px}
.mom b{font-size:26px}
.stat-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hpline{display:flex;flex-direction:column;gap:3px;width:100%}
.hpline .n{font-size:15px;font-weight:600}
.balance{display:flex;align-items:center;gap:6px;width:100%}
.balance .zh{font-size:17px}
.balance .track{flex:1;height:8px;border-radius:4px;position:relative;background:linear-gradient(90deg,var(--cin) 0 12%,var(--panel2) 12% 88%,var(--cin) 88%)}
.balance .track::after{content:"";position:absolute;left:41%;width:18%;top:0;bottom:0;background:color-mix(in srgb,var(--jade) 40%,transparent)}
.balance .mark{position:absolute;top:-4px;width:4px;height:16px;background:var(--fg);border-radius:2px;transform:translateX(-50%);transition:left .3s;z-index:1}

/* preview */
.preview{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-height:112px;display:flex;flex-direction:column;gap:5px}
.preview .hint{color:var(--mute);font-size:15px;margin:auto 0}
.pv-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pv-head b{font-size:19px}
.pv-head .hx{color:var(--mute);font-size:14px}
.pv-head .hx .zh{color:var(--fg);font-size:17px}
.pv-text{font-size:15px}
.tr{font-size:14px;font-weight:600;color:var(--tc);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tr span{font-weight:400;color:var(--fg)}
.pv-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.extra{font-size:13px;color:var(--jade)}
.t-flow{--tc:var(--jade)}.t-step{--tc:var(--stone)}.t-break{--tc:var(--plum)}.t-still{--tc:var(--gold)}.t-mirror{--tc:var(--azure)}.t-rev{--tc:var(--cin)}

/* hand */
.hand{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:thin}
.card{flex:0 0 calc((100% - 28px)/5);min-width:58px;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;border:2px solid transparent;transition:transform .15s}
.card.sel{border-color:var(--gold);transform:translateY(-8px)}
.card.na{opacity:.5}
.card.temp{background:#f0d9a8}
.card .cost{position:absolute;top:-8px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--cin);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;border:2px solid var(--ink)}
.card .cost.down{background:var(--jade)}.card .cost.up{background:var(--plum)}
.card .badge{position:absolute;top:-7px;right:-4px;font-size:10px;letter-spacing:.06em;padding:1px 4px;border-radius:3px;color:#fff;background:var(--tc);font-weight:700}
.card .nm{font-size:13px;font-weight:600;line-height:1.05;text-align:center;min-height:2.1em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .hn{font-size:11px;color:var(--paper-mute)}
.card .hn .zh{font-size:13px;color:var(--paper-ink)}

.actions{display:flex;gap:8px;align-items:center}
.actions .piles{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.log{font-size:13px;color:var(--mute);min-height:1.3em;text-align:center}

/* big card (reward, deck, cultivate) */
.bigcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bigcard{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid transparent;position:relative}
button.bigcard:hover{border-color:var(--gold)}
.bigcard.sel{border-color:var(--jade)}
.bigcard .row{display:flex;gap:10px;align-items:center}
.bigcard b{font-size:17px;line-height:1.1}
.bigcard .hn{font-size:13px;color:var(--paper-mute)}
.bigcard .hn .zh{font-size:16px;color:var(--paper-ink)}
.bigcard p{margin:0;font-size:14px}
.bigcard .links{font-size:12px;color:var(--paper-mute);border-top:1px solid #cfc4ab;padding-top:5px}
.bigcard .cost{position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--cin);color:#fff;display:grid;place-items:center;font-weight:700}

/* screens */
.screen{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.screen h1{font-size:34px;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-wrap:balance}
.screen h2{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.screen p{margin:0;font-size:16px;max-width:62ch}
.seal{width:84px;height:84px;background:var(--cin);color:#f6ead9;display:grid;place-items:center;font-size:58px;border-radius:6px;transform:rotate(-3deg);box-shadow:inset 0 0 0 4px var(--cin),inset 0 0 0 6px #f6ead955}
.titlehead{display:flex;gap:16px;align-items:center}
.rules{display:grid;gap:8px}
.rules li{font-size:15px}
.note{background:var(--panel);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px;font-size:15px}
.choice{display:grid;gap:10px}
.choice .btn{text-align:left;text-transform:none;font-size:17px;padding:14px;letter-spacing:0}
.choice .btn small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.cultbox{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cultbox .info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 80%,transparent);z-index:20;display:flex;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;max-width:560px;width:100%;height:max-content;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:22px}
.modal h4{margin:6px 0 0;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--rule);padding:6px 6px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.form{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:8px;padding:10px}
.form .seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form .step{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.form .step .zh{font-size:16px}
.form.done{outline:1px solid var(--gold)}

.fl{position:fixed;pointer-events:none;font-weight:700;font-size:22px;z-index:30;animation:rise 1.1s ease-out forwards;text-shadow:0 2px 4px #000;white-space:nowrap;transform:translateX(-50%)}
.fl.dmg{color:#ff7a5c}.fl.blk{color:var(--azure)}.fl.good{color:var(--jade)}.fl.gold{color:var(--gold)}.fl.big{font-size:28px}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (max-width:380px){.hex.big{--w:108px;--h:12px}.fstance{width:76px}}
</style>

<div id="app"></div>
<div id="modal"></div>

<script>
/* ---------- Hexagram data ---------- */
// Trigram bits, bottom line = bit 0. Order used by the King Wen lookup table.
const ORDER=[7,1,2,4,0,6,5,3]; // Heaven Thunder Water Mountain Earth Wind Fire Lake
const KW=[[1,25,6,33,12,44,13,10],[34,51,40,62,16,32,55,54],[5,3,29,39,8,48,63,60],[26,27,4,52,23,18,22,41],[11,24,7,15,2,46,36,19],[9,42,59,53,20,57,37,61],[14,21,64,56,35,50,30,38],[43,17,47,31,45,28,49,58]];
const BITS=[],NUM=[];
KW.forEach((row,u)=>row.forEach((n,l)=>{const b=ORDER[l]|(ORDER[u]<<3);BITS[n]=b;NUM[b]=n}));
const ZH=['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','无妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
const EN=['The Creative','The Receptive','Difficult Beginning','Youthful Folly','Waiting','Conflict','The Army','Holding Together','Small Taming','Treading','Peace','Standstill','Fellowship','Great Possession','Modesty','Enthusiasm','Following','Work on the Decayed','Approach','Contemplation','Biting Through','Grace','Splitting Apart','Return','Innocence','Great Taming','Nourishment','Great Exceeding','The Abysmal','The Clinging','Influence','Duration','Retreat','Great Power','Progress','Darkening Light','The Family','Opposition','Obstruction','Deliverance','Decrease','Increase','Breakthrough','Coming to Meet','Gathering','Pushing Upward','Oppression','The Well','Revolution','The Cauldron','The Arousing','Keeping Still','Development','Marrying Maiden','Abundance','The Wanderer','The Gentle','The Joyous','Dispersion','Limitation','Inner Truth','Small Exceeding','After Completion','Before Completion'];
const hz=n=>ZH[n-1], he=n=>EN[n-1];
const pop=x=>{let k=0;while(x){k+=x&1;x>>=1}return k};
const rev=b=>{let r=0;for(let i=0;i<6;i++)if(b>>i&1)r|=1<<(5-i);return r};
const yang=b=>pop(b);

/* ---------- Transitions ---------- */
function classify(a,b){
  const d=a^b,n=pop(d);
  if(n===0)return{type:'still',n};
  if(b===(a^63))return{type:'reversal',n,mirror:b===rev(a)};
  if(b===rev(a))return{type:'mirror',n};
  if(n===1){const line=Math.log2(d);return{type:'flow',n,line,dir:(b>>line&1)?'hard':'soft'}}
  if(n===2)return{type:'step',n};
  return{type:'break',n};
}
const REGION=l=>l<2?'Earth':l<4?'Human':'Heaven';
function lineFx(line,dir){
  const r=REGION(line);
  if(r==='Earth')return dir==='hard'?{name:'Advance',desc:'next attack +3'}:{name:'Sidestep',desc:'dodge the next hit'};
  if(r==='Human')return dir==='hard'?{name:'Rooted Strength',desc:'+1 Strength this turn'}:{name:'Yielding Guard',desc:'+4 Block'};
  return dir==='hard'?{name:'Surge',desc:'+1 Qi'}:{name:'Insight',desc:'draw 1'};
}
function trInfo(tr,card){
  const mom=G.c?G.c.momentum:0;
  switch(tr.type){
    case 'flow':{const fx=lineFx(tr.line,tr.dir);return{cls:'t-flow',short:'FLOW',label:`Flow · line ${tr.line+1} ${tr.dir==='hard'?'turns yang':'turns yin'}`,desc:`−1 Qi, +1 Momentum, ${fx.name}: ${fx.desc}`}}
    case 'step':return{cls:'t-step',short:'STEP',label:'Step · 2 lines change',desc:'normal play, Momentum kept'};
    case 'break':return{cls:'t-break',short:'BREAK',label:`Broken rhythm · ${tr.n} lines change`,desc:'+1 Qi cost, Momentum lost'};
    case 'still':return{cls:'t-still',short:'STILL',label:'Stillness · same hexagram',desc:'×1.5 potency, Momentum kept'};
    case 'mirror':return{cls:'t-mirror',short:'MIRROR',label:'Mirror · your stance upside down',desc:'counter the next attack against you'};
    case 'reversal':{const k=card&&CARDS[card.id].revBonus?2:1;return{cls:'t-rev',short:'REVERSE',label:'Reversal · every line flips'+(tr.mirror?' (and Mirror)':''),desc:`spends ${mom} Momentum for ×${1+mom*k} potency`+(tr.mirror?', counter next attack':'')}}
  }
}

/* ---------- Cards ---------- */
const CARDS={
  guard:{name:'Receptive Guard',hex:2,cost:1,text:'Gain 6 Block.',play:x=>B(x,6)},
  returnFist:{name:'Returning Fist',hex:24,cost:1,text:'Deal 6.',play:x=>A(x,6)},
  approach:{name:'Approaching Step',hex:19,cost:1,text:'Deal 4. Gain 3 Block.',play:x=>{A(x,4);B(x,3)}},
  peace:{name:'Peaceful Palm',hex:11,cost:1,text:'Deal 8.',play:x=>A(x,8)},
  thunder:{name:'Thunder Step',hex:51,cost:1,text:'Deal 3 twice.',play:x=>A(x,3,2)},
  willow:{name:'Willow Sway',hex:57,cost:1,text:'Gain 5 Block. Draw 1.',play:x=>{B(x,5);draw(1)}},
  still:{name:'Stone Stance',hex:52,cost:1,text:'Gain 7 Block.',play:x=>B(x,7)},
  gate:{name:'Closed Gate',hex:12,cost:1,text:'Gain 4 Block. Deal 3.',play:x=>{B(x,4);A(x,3)}},
  // reward pool
  dragon:{name:'Hidden Dragon Palm',hex:1,cost:2,text:'Deal 13. If you had 3+ Momentum, lose 3 HP (the arrogant dragon repents).',play:x=>{A(x,13);if(x.momBefore>=3)selfHurt(3,'Arrogant dragon')}},
  breakthrough:{name:'Breakthrough Fist',hex:43,cost:2,text:'Deal 10, ignoring Block.',play:x=>A(x,10,1,true)},
  meet:{name:'Coming to Meet',hex:44,cost:1,text:'Deal 5. Gain 4 Block.',play:x=>{A(x,5);B(x,4)}},
  power:{name:'Great Power',hex:34,cost:1,text:'Gain 2 Strength for this duel. Exhaust.',exhaust:true,play:x=>{G.c.str+=2;fl('me','+2 Strength','gold')}},
  abyss:{name:'River Turning',hex:29,cost:2,text:'Gain 4 Block. Counter the next attack.',play:x=>{B(x,4);G.c.counter=true}},
  clinging:{name:'Clinging Flame',hex:30,cost:1,text:'Apply 4 Burn.',play:x=>{const v=Math.floor(4*x.mult);G.c.foe.burn+=v;fl('foe','+'+v+' Burn','gold')}},
  biting:{name:'Biting Through',hex:21,cost:1,text:'Deal 7.',play:x=>A(x,7)},
  upward:{name:'Pushing Upward',hex:46,cost:1,text:'Deal 4. Gain 1 Momentum.',play:x=>{A(x,4);G.c.momentum++}},
  modesty:{name:'Modest Bow',hex:15,cost:0,text:'Gain 4 Block.',play:x=>B(x,4)},
  increase:{name:'Increase',hex:42,cost:1,text:'Draw 2.',play:x=>draw(2)},
  decrease:{name:'Decrease',hex:41,cost:0,text:'Lose 2 HP. Gain 1 Qi.',play:x=>{selfHurt(2);G.c.qi++}},
  before:{name:'Before Completion',hex:64,cost:2,text:'Deal 8. Reversals into this card count Momentum twice.',revBonus:true,play:x=>A(x,8)},
  after:{name:'After Completion',hex:63,cost:2,text:'Gain 14 Block.',play:x=>B(x,14)},
  treading:{name:"Tiger's Tail Step",hex:10,cost:1,text:'Deal 6. Sidestep the next hit.',play:x=>{A(x,6);G.c.sidestep=true}},
  drum:{name:'Rousing Drum',hex:16,cost:1,text:'Deal 4. If played by Flow, gain 1 Qi.',play:x=>{A(x,4);if(x.tr.type==='flow')G.c.qi++}},
  duration:{name:'Enduring Wind',hex:32,cost:1,text:'Deal 4. Gain 4 Block.',play:x=>{A(x,4);B(x,4)}},
  split:{name:'Splitting Apart',hex:23,cost:1,text:'Remove all enemy Block. Deal 5.',play:x=>{G.c.foe.block=0;A(x,5)}},
  army:{name:'Ranks of the Army',hex:7,cost:1,text:'Deal 5. Gain 4 Block.',play:x=>{A(x,5);B(x,4)}},
  feint:{name:'Joyous Lake Feint',hex:58,cost:1,text:'Deal 4. Draw 1.',play:x=>{A(x,4);draw(1)}},
  taming:{name:'Small Taming',hex:9,cost:1,text:'Gain 5 Block. Enemy loses 2 Strength.',play:x=>{B(x,5);G.c.foe.str-=2;fl('foe','−2 Strength','good')}},
  sprout:{name:'Sprouting Blade',hex:3,cost:0,text:'Deal 3. Draw 1.',play:x=>{A(x,3);draw(1)}},
  // forms
  f_spring:{name:'Spring Thunder Strike',hex:25,cost:1,form:true,exhaust:true,text:'Deal 14. Exhaust.',play:x=>A(x,14)},
  f_ascend:{name:'Great Power Surge',hex:34,cost:1,form:true,exhaust:true,text:'Deal 10. Gain 2 Strength for this duel. Exhaust.',play:x=>{A(x,10);G.c.str+=2}},
  f_mountain:{name:'Immovable Mountain',hex:23,cost:1,form:true,exhaust:true,text:'Gain 12 Block. Counter the next attack. Exhaust.',play:x=>{B(x,12);G.c.counter=true}},
};
const STARTER=['guard','guard','returnFist','returnFist','approach','peace','thunder','willow','still','gate'];
const POOL=['dragon','breakthrough','meet','power','abyss','clinging','biting','upward','modesty','increase','decrease','before','after','treading','drum','duration','split','army','feint','taming','sprout'];
const FORMS=[
  {id:'spring',name:'Spring Thunder',seq:[2,24,51],card:'f_spring',lore:'Earth lies still, the first yang returns, thunder wakes.'},
  {id:'ascend',name:'Ascending Peace',seq:[24,19,11],card:'f_ascend',lore:'One yang line, then two, then three: Heaven rises beneath Earth.'},
  {id:'mountain',name:'The Mountain Bows',seq:[52,15,2],card:'f_mountain',lore:'Stillness lowers itself into Modesty, then into the Receptive.'},
];

/* ---------- Foes ---------- */
const FOES=[
  {name:'Disciple Shen',school:'Stone Gate Hall',glyph:'☶',hp:42,moves:[{hex:33,t:'atk',v:7},{hex:12,t:'blkatk',b:6,v:5},{hex:52,t:'atk',v:10}]},
  {name:'Adept Lei',school:'Thunder Step Sect',glyph:'☳',hp:50,moves:[{hex:51,t:'atk',v:3,hits:3},{hex:16,t:'buff',s:2},{hex:44,t:'atk',v:8}]},
  {name:'Lantern Keeper Hua',school:'Crimson Lantern Society',glyph:'☲',hp:58,moves:[{hex:30,t:'burnatk',burn:3,v:5},{hex:1,t:'atk',v:13},{hex:50,t:'blkbuff',b:10,s:1}]},
  {name:'Master of Changes',school:'Hall of the Sixty-Four',glyph:'易',hp:115,boss:true,moves:[{hex:63,t:'atk',v:8,hits:2},{hex:64,t:'blkbuff',b:12,s:2},{hex:63,t:'burnatk',burn:4,v:8},{hex:64,t:'atk',v:22}]},
];

/* ---------- State ---------- */
let G=null;
const UI={modal:null,sel:null,shift:false,cult:null,cultLine:null};
const $app=document.getElementById('app'),$modal=document.getElementById('modal');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let floats=[];
function fl(target,text,cls=''){floats.push({target,text,cls})}

function newGame(){
  G={screen:'combat',hp:64,maxHp:64,deck:[],fight:0,mastered:new Set(),uid:0,notes:[],reward:null};
  STARTER.forEach(id=>addCard(id));
  startCombat();
}
function addCard(id,extra={}){G.deck.push(Object.assign({uid:++G.uid,id,hex:CARDS[id].hex},extra))}
const costOf=inst=>inst.cost!=null?inst.cost:CARDS[inst.id].cost;

function startCombat(){
  const f=FOES[G.fight];
  G.c={draw:shuffle(G.deck.map(x=>({...x}))),hand:[],discard:[],exhaust:[],qi:3,stance:BITS[2],momentum:0,balance:0,block:0,str:0,tempStr:0,advance:0,sidestep:false,counter:false,burn:0,shiftUsed:false,history:[2],formsTurn:new Set(),formsDone:new Set(),log:'You take the Receptive stance. Bow, and begin.',lastMask:0,busy:false,turn:0,
    foe:{...f,hp:f.hp,max:f.hp,block:0,str:0,burn:0,mi:0,interrupted:false}};
  G.screen='combat';UI.sel=null;UI.shift=false;
  startTurn();
}
const curMove=()=>{const f=G.c.foe;return f.moves[f.mi%f.moves.length]};

function draw(n){
  const c=G.c;
  for(let i=0;i<n;i++){
    if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}
    if(c.hand.length>=10)break;
    c.hand.push(c.draw.pop());
  }
}
function startTurn(){
  const c=G.c;c.turn++;c.block=0;c.tempStr=0;c.counter=false;c.sidestep=false;c.formsTurn=new Set();
  const notes=[];
  if(c.burn>0){selfHurt(c.burn,'Burn');c.burn--}
  if(Math.abs(c.balance)>=9){selfHurt(3);c.tempStr+=2;notes.push('Qi Deviation: −3 HP, +2 Strength this turn');fl('me','Qi Deviation','dmg')}
  else if(c.turn>1&&Math.abs(c.balance)<=2){c.block+=3;notes.push('Harmony: +3 Block');fl('me','Harmony +3 Block','blk')}
  c.balance=c.balance>0?Math.max(0,c.balance-2):Math.min(0,c.balance+2);
  c.qi=3;c.shiftUsed=false;c.foe.interrupted=false;
  draw(5);
  if(notes.length)c.log=notes.join(' · ');
  render();
  if(G.hp<=0)return lose();
}

/* ---------- Effects ---------- */
function A(x,base,hits=1,pierce=false){
  const c=G.c;
  for(let i=0;i<hits;i++){
    let d=base+c.str+c.tempStr+c.momentum;
    if(c.advance){d+=c.advance;c.advance=0}
    d=Math.max(0,Math.floor(d*x.mult));
    hitFoe(d,pierce);
    if(c.foe.hp<=0)break;
  }
}
function B(x,n){const v=Math.floor(n*x.mult);G.c.block+=v;fl('me','+'+v+' Block','blk')}
function hitFoe(d,pierce,tag){
  const f=G.c.foe;
  if(!pierce&&f.block){const a=Math.min(f.block,d);f.block-=a;d-=a}
  f.hp=Math.max(0,f.hp-d);fl('foe',(tag?tag+' ':'')+'−'+d,'dmg big');G.c.shake=true;
}
function selfHurt(d,tag){G.hp=Math.max(0,G.hp-d);fl('me',(tag?tag+' ':'')+'−'+d,'dmg')}
function hurtMe(d){
  const c=G.c;
  if(c.counter){c.counter=false;fl('me','Countered!','gold');hitFoe(d,true,'Reflected');return}
  if(c.sidestep){c.sidestep=false;fl('me','Sidestep','good');return}
  if(c.block){const a=Math.min(c.block,d);c.block-=a;d-=a}
  if(d>0)selfHurt(d);else fl('me','Blocked','blk');
}

/* ---------- Player actions ---------- */
function effCost(inst,tr){const b=costOf(inst);if(tr.type==='flow')return Math.max(0,b-1);if(tr.type==='break')return b+1;return b}
function play(idx){
  const c=G.c;if(c.busy)return;
  const inst=c.hand[idx],def=CARDS[inst.id],bits=BITS[inst.hex];
  const tr=classify(c.stance,bits),cost=effCost(inst,tr);
  if(c.qi<cost)return;
  c.qi-=cost;c.hand.splice(idx,1);UI.sel=null;
  const x={mult:1,tr,inst,momBefore:c.momentum};
  const msgs=[`${def.name}: ${trInfo(tr,inst).short.toLowerCase()}`];
  if(tr.type==='flow'){
    c.momentum++;const fx=lineFx(tr.line,tr.dir);msgs.push(fx.name);
    if(fx.name==='Advance')c.advance+=3;else if(fx.name==='Sidestep')c.sidestep=true;
    else if(fx.name==='Rooted Strength')c.tempStr++;else if(fx.name==='Yielding Guard'){c.block+=4;fl('me','+4 Block','blk')}
    else if(fx.name==='Surge')c.qi++;else draw(1);
  }else if(tr.type==='break')c.momentum=0;
  else if(tr.type==='still')x.mult=1.5;
  else if(tr.type==='mirror'){c.counter=true;msgs.push('counter ready')}
  else if(tr.type==='reversal'){x.mult=1+c.momentum*(def.revBonus?2:1);msgs.push('×'+x.mult);if(x.mult>1)fl('me','×'+x.mult,'gold big');c.momentum=0;if(tr.mirror)c.counter=true}
  // interrupt the foe by striking from the opposite of its stance
  const fb=BITS[curMove().hex];
  if(bits===(fb^63)&&!c.foe.interrupted){c.foe.interrupted=true;msgs.push('Interrupt!');fl('foe','Interrupted','good')}
  def.play(x);
  c.balance=Math.max(-12,Math.min(12,c.balance+yang(bits)-3));
  c.lastMask=c.stance^bits;c.stance=bits;c.history.push(inst.hex);
  checkForms(msgs);
  (def.exhaust||inst.temp?c.exhaust:c.discard).push(inst);
  c.log=msgs.join(' · ');
  render();checkEnd();
}
function shiftLine(i){
  const c=G.c;if(c.qi<1||c.shiftUsed||c.busy)return;
  c.qi--;c.shiftUsed=true;UI.shift=false;
  c.lastMask=1<<i;c.stance^=1<<i;c.history.push(NUM[c.stance]);
  c.balance=Math.max(-12,Math.min(12,c.balance+((c.stance>>i&1)?1:-1)));
  const msgs=[`Shift: stance becomes ${hz(NUM[c.stance])} ${he(NUM[c.stance])}`];
  checkForms(msgs);c.log=msgs.join(' · ');render();
}
function checkForms(msgs){
  const c=G.c,h=c.history;
  for(const f of FORMS){
    if(c.formsTurn.has(f.id)||h.length<3)continue;
    const t=h.slice(-3);
    if(t.every((n,i)=>n===f.seq[i])){
      c.formsTurn.add(f.id);c.formsDone.add(f.id);
      c.hand.push({uid:'t'+Math.random(),id:f.card,hex:CARDS[f.card].hex,temp:true,cost:0});
      msgs.push(`Form performed: ${f.name}!`);fl('me',f.name+'!','gold big');
    }
  }
}
function endTurn(){
  const c=G.c;if(c.busy)return;c.busy=true;UI.sel=null;UI.shift=false;
  c.hand.forEach(x=>(x.temp?c.exhaust:c.discard).push(x));c.hand=[];
  render();setTimeout(foeTurn,500);
}
function foeTurn(){
  const c=G.c,f=c.foe;
  if(f.burn>0){hitFoe(f.burn,true,'Burn');f.burn--;if(f.hp<=0){render();return checkEnd()}}
  f.block=0;
  const m=curMove(),k=f.interrupted?0.5:1,h=v=>Math.floor(v*k);
  const atk=(v,hits=1)=>{for(let i=0;i<hits;i++)hurtMe(Math.max(0,h(v)+f.str))};
  if(m.t==='atk')atk(m.v,m.hits||1);
  else if(m.t==='blkatk'){f.block+=h(m.b);atk(m.v)}
  else if(m.t==='buff'){f.str+=h(m.s)}
  else if(m.t==='blkbuff'){f.block+=h(m.b);f.str+=h(m.s)}
  else if(m.t==='burnatk'){c.burn+=h(m.burn);atk(m.v)}
  c.log=`${f.name}: ${intentText(m,f)}${f.interrupted?' (interrupted, halved)':''}.`;
  f.mi++;c.busy=false;
  if(f.hp<=0){render();return checkEnd()}
  if(G.hp<=0){render();return lose()}
  startTurn();
}
function intentText(m,f){
  const s=f?f.str:0,v=x=>Math.max(0,x+s);
  switch(m.t){
    case 'atk':return m.hits>1?`Attack ${v(m.v)}×${m.hits}`:`Attack ${v(m.v)}`;
    case 'blkatk':return `Block ${m.b} · Attack ${v(m.v)}`;
    case 'buff':return `Gather strength +${m.s}`;
    case 'blkbuff':return `Block ${m.b} · Strength +${m.s}`;
    case 'burnatk':return `Burn ${m.burn} · Attack ${v(m.v)}`;
  }
}
function checkEnd(){
  const c=G.c;
  if(c.foe.hp<=0&&!c.won){c.won=true;c.busy=true;setTimeout(win,700)}
  else if(G.hp<=0)lose();
}
function win(){
  const c=G.c,f=c.foe;G.notes=[];
  for(const id of c.formsDone){
    if(!G.mastered.has(id)){const fm=FORMS.find(x=>x.id===id);G.mastered.add(id);addCard(fm.card);G.notes.push(`Form mastered: ${fm.name}. ${CARDS[fm.card].name} joins your deck.`)}
  }
  if(f.boss){G.screen='victory';UI.sel=null;return render()}
  const pool=shuffle(POOL.slice()).slice(0,3);
  G.reward=pool;G.screen='reward';render();
}
function lose(){if(G.screen==='dead')return;G.screen='dead';render()}

/* ---------- Deck links ---------- */
function links(bits,excludeUid){
  let flow=0,rv=0,mr=0;
  for(const d of G.deck){if(d.uid===excludeUid)continue;const b=BITS[d.hex];
    if(pop(b^bits)===1)flow++;else if(b===(bits^63))rv++;else if(b===rev(bits)&&b!==bits)mr++}
  return{flow,rv,mr};
}
const linksText=l=>`Links in deck: ${l.flow} flow · ${l.rv} reversal · ${l.mr} mirror`;

/* ---------- Rendering ---------- */
function hexHTML(bits,cls='',o={}){
  let s=`<div class="hex ${cls}" ${o.style?`style="${o.style}"`:''} aria-label="Hexagram ${NUM[bits]} ${he(NUM[bits])}">`;
  for(let i=5;i>=0;i--){
    const y=bits>>i&1,k=[y?'yang':'yin'];
    if(o.chg&(1<<i))k.push('chg');if(o.flip&(1<<i))k.push('flip');if(o.tap)k.push('tap');if(o.pick===i)k.push('pick');
    s+=`<div class="ln ${k.join(' ')}" ${o.tap?`data-act="${o.tap}" data-i="${i}" role="button" tabindex="0" aria-label="Line ${i+1}"`:''}>${y?'<i></i>':'<i></i><i></i>'}</div>`;
  }
  return s+'</div>';
}
const hexName=n=>`<span class="zh">${hz(n)}</span> ${n} · ${he(n)}`;

function render(){
  const s=G?G.screen:'title';
  $app.innerHTML=s==='title'?renderTitle():s==='combat'?renderCombat():s==='reward'?renderReward():s==='rest'?renderRest():s==='cult'?renderCult():renderEnd();
  renderModal();
  if(G&&G.c){G.c.lastMask=0;if(G.c.shake){G.c.shake=false;const e=document.getElementById('foeBox');if(e){e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}}}
  flushFloats();
}
function flushFloats(){
  const list=floats;floats=[];
  list.forEach((f,i)=>{
    const el=document.getElementById(f.target==='foe'?'foeBox':'meBox');if(!el)return;
    const r=el.getBoundingClientRect(),d=document.createElement('div');
    d.className='fl '+f.cls;d.textContent=f.text;
    d.style.left=(r.left+r.width/2+(i%3-1)*40)+'px';d.style.top=(r.top+r.height*.35+i*10)+'px';
    document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
  });
}
function roadHTML(){
  return `<div class="road" aria-label="Journey">${FOES.map((f,i)=>`<span class="${i<G.fight?'done':i===G.fight?'now':''}" title="${f.school}">${f.glyph}</span>`).join('')}</div>`;
}
function renderTitle(){
  return `<div class="screen">
  <div class="titlehead"><div class="seal zh">變</div><div><h1>Changing Lines</h1><p class="mute">A wuxia deckbuilder of the sixty-four hexagrams</p></div></div>
  <p>You walk the rivers and lakes of the jianghu, testing your hands against three schools and then the Master of Changes. Every technique you know is a hexagram. How you move between them decides how hard you hit.</p>
  <ul class="rules">
    <li><b>Your stance</b> is the hexagram of the last technique you played.</li>
    <li><b class="t-flow" style="color:var(--jade)">Flow</b>: change one line. The move costs 1 less Qi, builds Momentum and triggers that line's effect.</li>
    <li><b style="color:var(--cin)">Reversal</b>: flip all six lines to spend your Momentum as a multiplier.</li>
    <li><b style="color:var(--azure)">Mirror</b>: play your stance turned upside down to counter the next blow.</li>
    <li>Strike from the <b>opposite</b> of your foe's stance to interrupt them. Chain the sequences in your Manual to perform <b>Forms</b>.</li>
  </ul>
  <div><button class="btn primary" data-act="start">Begin the journey</button></div>
  <p class="mute" style="font-size:14px">Tap a card to preview its transition, tap again (or press Play) to use it. The Rules button explains everything during a duel.</p>
  </div>`;
}
function statusChips(){
  const c=G.c,a=[];
  if(c.block)a.push(`<span class="chip blk">Block ${c.block}</span>`);
  if(c.str+c.tempStr)a.push(`<span class="chip str">Strength ${c.str+c.tempStr}</span>`);
  if(c.advance)a.push(`<span class="chip good">Advance +${c.advance}</span>`);
  if(c.sidestep)a.push(`<span class="chip good">Sidestep</span>`);
  if(c.counter)a.push(`<span class="chip gold">Counter</span>`);
  if(c.burn)a.push(`<span class="chip burn">Burn ${c.burn}</span>`);
  return a.join('');
}
function renderCombat(){
  const c=G.c,f=c.foe,m=curMove(),fb=BITS[m.hex],comp=NUM[fb^63];
  const sel=UI.sel!=null?c.hand[UI.sel]:null;
  let chg=0,tr=null,info=null;
  if(sel){const b=BITS[sel.hex];tr=classify(c.stance,b);chg=c.stance^b;info=trInfo(tr,sel)}
  const stanceNum=NUM[c.stance];
  const qiPips=Array.from({length:Math.max(3,c.qi)},(_,i)=>`<i class="${i<c.qi?'f':''}"></i>`).join('');
  const balPct=50+c.balance/12*50;
  const foeChips=[f.block?`<span class="chip blk">Block ${f.block}</span>`:'',f.str?`<span class="chip str">Strength ${f.str}</span>`:'',f.burn?`<span class="chip burn">Burn ${f.burn}</span>`:''].join('');

  let pv;
  if(UI.shift)pv=`<div class="hint">Tap one line of your stance to flip it. Costs 1 Qi, once per turn. Shifting counts toward Forms. <button class="btn" data-act="shift" style="margin-left:6px">Cancel</button></div>`;
  else if(sel){
    const def=CARDS[sel.id],cost=effCost(sel,tr),can=c.qi>=cost&&!c.busy;
    const extras=[];
    if(BITS[sel.hex]===(fb^63)&&!f.interrupted)extras.push(`Opposes ${f.name}'s stance: interrupts, halving their move.`);
    const hist=c.history.slice(-2).concat(sel.hex);
    FORMS.forEach(fm=>{if(hist.length===3&&hist.every((n,i)=>n===fm.seq[i])&&!c.formsTurn.has(fm.id))extras.push(`Completes the Form “${fm.name}”.`)});
    if(sel.id==='dragon'&&c.momentum>=3)extras.push('Momentum 3+: you will lose 3 HP.');
    pv=`<div class="pv-head"><b>${def.name}</b><span class="hx">${hexName(sel.hex)}</span></div>
      <div class="pv-text">${def.text}</div>
      <div class="tr ${info.cls}">${info.label}<span>${info.desc}</span></div>
      ${extras.map(e=>`<div class="extra">${e}</div>`).join('')}
      <div class="pv-row"><span class="mute" style="font-size:13px">${cost} Qi${cost!==costOf(sel)?` (base ${costOf(sel)})`:''}</span><button class="btn primary" data-act="play" ${can?'':'disabled'}>${c.qi<cost?'Not enough Qi':'Play'}</button></div>`;
  }else pv=`<div class="hint">${c.log||'Tap a technique to see how it moves from your stance.'}</div>`;

  return `
  <div class="top">${roadHTML()}<span class="sp"></span>
    <button class="iconbtn" data-act="m:rules">Rules</button><button class="iconbtn" data-act="m:manual">Manual</button><button class="iconbtn" data-act="m:deck">Deck</button></div>
  <section class="foe" id="foeBox">
    <div class="left">
      <div><div class="school">${f.school}</div><h2>${f.name}</h2></div>
      <div class="bar"><b style="width:${f.hp/f.max*100}%"></b></div>
      <div class="chips"><span class="chip">${f.hp} / ${f.max}</span>${foeChips}</div>
      <div class="intent ${f.interrupted?'cut':''}"><span class="stat-label">Next</span><span class="what">${intentText(m,f)}</span>${f.interrupted?'<span class="chip good">Interrupted</span>':''}</div>
    </div>
    <div class="fstance">${hexHTML(fb,'mid')}<span class="zh">${hz(m.hex)}</span><span>${he(m.hex)}</span>
      <span class="counterhint">Interrupt with<br><b>${hz(comp)} ${he(comp)}</b></span></div>
  </section>
  <section class="stance" id="meBox">
    <div class="side">
      <div><div class="stat-label">Qi</div><div class="qi">${qiPips}</div></div>
      <div class="mom"><span class="zh">勢</span> <b>${c.momentum}</b> <span class="mute">momentum</span></div>
      <div class="hpline"><div class="stat-label">Health</div><span class="n">${G.hp} / ${G.maxHp}</span><div class="bar me"><b style="width:${G.hp/G.maxHp*100}%"></b></div></div>
    </div>
    <div class="mid ${info?info.cls:''}">
      <span class="label">Your stance</span>
      ${hexHTML(c.stance,'big',{chg,flip:c.lastMask,tap:UI.shift?'shiftline':null})}
      <div class="name"><span class="zh">${hz(stanceNum)}</span><small>${stanceNum} · ${he(stanceNum)}</small></div>
    </div>
    <div class="side r">
      <div style="width:100%"><div class="stat-label">Yin · Yang</div>
        <div class="balance"><span class="zh">陰</span><div class="track"><span class="mark" style="left:${balPct}%"></span></div><span class="zh">陽</span></div></div>
      <div class="chips" style="justify-content:flex-end">${statusChips()}</div>
    </div>
  </section>
  <section class="preview" aria-live="polite">${pv}</section>
  <section class="hand">${c.hand.map((h,i)=>{
      const t=classify(c.stance,BITS[h.hex]),ti=trInfo(t,h),ec=effCost(h,t),base=costOf(h);
      return `<button class="card ${ti.cls} ${UI.sel===i?'sel':''} ${c.qi<ec?'na':''} ${h.temp?'temp':''}" data-act="sel" data-i="${i}">
        <span class="cost ${ec<base?'down':ec>base?'up':''}">${ec}</span><span class="badge">${ti.short}</span>
        ${hexHTML(BITS[h.hex],'')}<span class="nm">${CARDS[h.id].name}</span><span class="hn"><span class="zh">${hz(h.hex)}</span> ${h.hex}</span></button>`}).join('')||'<div class="mute" style="padding:20px">Your hands are empty.</div>'}</section>
  <div class="actions">
    <button class="btn ${UI.shift?'on':''}" data-act="shift" ${c.shiftUsed||c.qi<1||c.busy?'disabled':''}>Shift line · 1 Qi</button>
    <span class="piles">Draw ${c.draw.length} · Discard ${c.discard.length}</span>
    <button class="btn primary" data-act="end" ${c.busy?'disabled':''}>End turn</button>
  </div>`;
}
function bigCard(id,hex,opt={}){
  const d=CARDS[id],l=opt.links;
  const tag=opt.btn?'button':'div';
  return `<${tag} class="bigcard ${opt.sel?'sel':''}" ${opt.act?`data-act="${opt.act}" data-i="${opt.i}"`:''}>
    <span class="cost">${opt.cost!=null?opt.cost:d.cost}</span>
    <div class="row">${hexHTML(BITS[hex],'mid',{style:'color:var(--paper-ink)'})}<div><b>${d.name}</b><div class="hn">${hexName(hex)}</div></div></div>
    <p>${d.text}</p>${l?`<div class="links">${linksText(l)}</div>`:''}</${tag}>`;
}
function renderReward(){
  const f=FOES[G.fight];
  return `<div class="screen">
    <div class="top">${roadHTML()}</div>
    <h2>${f.name} yields. The ${f.school} bows to you.</h2>
    ${G.notes.map(n=>`<div class="note">${n}</div>`).join('')}
    <p>Choose a technique to add to your deck. Links show how many of your cards it can Flow, Reverse or Mirror into.</p>
    <div class="bigcards">${G.reward.map((id,i)=>bigCard(id,CARDS[id].hex,{btn:true,act:'pick',i,links:links(BITS[CARDS[id].hex])})).join('')}</div>
    <div><button class="btn" data-act="pick" data-i="-1">Take nothing</button></div>
  </div>`;
}
function renderRest(){
  return `<div class="screen">
    <div class="top">${roadHTML()}</div>
    <h2>A mountain hermitage on the road</h2>
    <p>Health ${G.hp} / ${G.maxHp}. Next: ${FOES[G.fight].name} of the ${FOES[G.fight].school}.</p>
    <div class="choice">
      <button class="btn" data-act="heal">Meditate<small>Recover 18 health.</small></button>
      <button class="btn" data-act="cult">Cultivate<small>Flip one line of a technique's hexagram. The move keeps its effect but sits somewhere new in the Changes, so it links to different cards.</small></button>
    </div></div>`;
}
function renderCult(){
  const sel=UI.cult!=null?G.deck.find(d=>d.uid===UI.cult):null;
  let box='<p class="mute">Choose a technique below.</p>';
  if(sel){
    const b=BITS[sel.hex],nb=UI.cultLine!=null?b^(1<<UI.cultLine):null;
    const before=links(b,sel.uid),after=nb!=null?links(nb,sel.uid):null;
    box=`<div class="cultbox">${hexHTML(b,'big',{tap:'cline',pick:UI.cultLine})}
      <div class="info"><b style="font-size:19px">${CARDS[sel.id].name}</b>
        <div>Now: ${hexName(sel.hex)}</div><div class="mute" style="font-size:14px">${linksText(before)}</div>
        ${nb!=null?`<div style="color:var(--jade)">Becomes: ${hexName(NUM[nb])}</div><div class="mute" style="font-size:14px">${linksText(after)}</div>
        <div><button class="btn primary" data-act="cultok">Flip line ${UI.cultLine+1}</button></div>`:'<div class="mute">Tap a line to preview the change.</div>'}
      </div></div>`;
  }
  return `<div class="screen">
    <div class="top">${roadHTML()}</div>
    <h2>Cultivate a technique</h2>${box}
    <div class="bigcards">${G.deck.map(d=>bigCard(d.id,d.hex,{btn:true,act:'csel',i:d.uid,sel:d.uid===UI.cult,cost:costOf(d)})).join('')}</div>
    <div><button class="btn" data-act="cultback">Back</button></div></div>`;
}
function renderEnd(){
  const won=G.screen==='victory';
  return `<div class="screen">
    <div class="titlehead"><div class="seal zh">${won?'既濟':'未濟'}</div><div><h1>${won?'After Completion':'Before Completion'}</h1>
    <p class="mute">${won?'The Master of Changes lowers their hands. The jianghu will speak your name.':`You fell to ${G.c.foe.name} of the ${G.c.foe.school}. Every ending is the start of another change.`}</p></div></div>
    ${G.notes.map(n=>`<div class="note">${n}</div>`).join('')}
    <p>Forms mastered: ${G.mastered.size?[...G.mastered].map(id=>FORMS.find(f=>f.id===id).name).join(', '):'none'}. Deck size ${G.deck.length}.</p>
    <div><button class="btn primary" data-act="start">Walk the road again</button></div></div>`;
}

/* ---------- Modals ---------- */
function renderModal(){
  if(!UI.modal){$modal.innerHTML='';return}
  let body='';
  if(UI.modal==='rules')body=`<h3>How the Changes fight</h3>
    <p>Your stance is the hexagram of the last technique you played. Each new technique is judged by how its hexagram differs from your stance. Lines are counted from the bottom (1) to the top (6).</p>
    <h4>Transitions</h4><div class="tbl"><table><tr><th>Transition</th><th>When</th><th>Effect</th></tr>
    <tr><td style="color:var(--jade)">Flow</td><td>1 line changes</td><td>−1 Qi, +1 Momentum, line effect</td></tr>
    <tr><td>Step</td><td>2 lines change</td><td>Normal</td></tr>
    <tr><td style="color:var(--plum)">Broken rhythm</td><td>3–5 lines change</td><td>+1 Qi, Momentum lost</td></tr>
    <tr><td style="color:var(--gold)">Stillness</td><td>Same hexagram</td><td>×1.5 potency</td></tr>
    <tr><td style="color:var(--azure)">Mirror</td><td>Stance turned upside down</td><td>Counter the next attack (it hits them instead)</td></tr>
    <tr><td style="color:var(--cin)">Reversal</td><td>All 6 lines flip</td><td>Spend all Momentum: potency ×(1 + Momentum)</td></tr></table></div>
    <h4>Line effects on a Flow</h4><div class="tbl"><table><tr><th>Lines</th><th>Turns yang (hard)</th><th>Turns yin (soft)</th></tr>
    <tr><td>1–2 Earth</td><td>Advance: next attack +3</td><td>Sidestep: dodge next hit</td></tr>
    <tr><td>3–4 Human</td><td>Rooted Strength: +1 this turn</td><td>Yielding Guard: +4 Block</td></tr>
    <tr><td>5–6 Heaven</td><td>Surge: +1 Qi</td><td>Insight: draw 1</td></tr></table></div>
    <h4>Also</h4><ul class="rules">
    <li>Each attack deals +1 damage per point of Momentum.</li>
    <li><b>Interrupt:</b> play the exact opposite of your foe's stance to halve their next move.</li>
    <li><b>Shift line:</b> once per turn, pay 1 Qi to flip one line of your stance without playing a card.</li>
    <li><b>Yin · Yang:</b> yang-heavy cards push the meter right, yin-heavy left. Start a turn near the centre for Harmony (+3 Block). At either red end you suffer Qi Deviation (−3 HP, +2 Strength).</li>
    <li><b>Forms:</b> pass through the three hexagrams of a Form in order (cards or shifts) to get a free Form technique. Performing one in a duel masters it for the rest of the journey.</li></ul>`;
  else if(UI.modal==='manual')body=`<h3>Manual of Forms</h3><p class="mute">Pass through these stances in order. Your duel starts in 坤 The Receptive.</p>
    ${FORMS.map(f=>`<div class="form ${G&&G.mastered.has(f.id)?'done':''}"><b>${f.name}${G&&G.mastered.has(f.id)?' · mastered':''}</b>
      <div class="seq">${f.seq.map((n,i)=>`${i?'<span class="mute">→</span>':''}<div class="step">${hexHTML(BITS[n],'')}<span class="zh">${hz(n)}</span><span>${he(n)}</span></div>`).join('')}
      <span class="mute">⇒</span><div class="step">${hexHTML(BITS[CARDS[f.card].hex],'',{style:'color:var(--gold)'})}<span>${CARDS[f.card].name}</span></div></div>
      <span class="mute" style="font-size:14px">${f.lore} ${CARDS[f.card].text}</span></div>`).join('')}`;
  else if(UI.modal==='deck')body=`<h3>Your techniques (${G.deck.length})</h3><div class="bigcards">${G.deck.map(d=>bigCard(d.id,d.hex,{links:links(BITS[d.hex],d.uid),cost:costOf(d)})).join('')}</div>`;
  $modal.innerHTML=`<div class="modal" data-act="close"><div class="sheet" data-stop="1">${body}<div><button class="btn" data-act="close">Close</button></div></div></div>`;
}

/* ---------- Input ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){return}
  if(el.dataset.act==='close'&&e.target.closest('[data-stop]')&&el.classList.contains('modal'))return;
  const act=el.dataset.act,i=el.dataset.i!=null?el.dataset.i:null;
  if(act.startsWith('m:')){UI.modal=act.slice(2);return renderModal()}
  switch(act){
    case 'close':UI.modal=null;return renderModal();
    case 'start':UI.modal=null;return newGame();
    case 'sel':{const k=+i;if(G.c.busy)return;UI.shift=false;if(UI.sel===k)return play(k);UI.sel=k;return render()}
    case 'play':if(UI.sel!=null)play(UI.sel);return;
    case 'end':return endTurn();
    case 'shift':UI.shift=!UI.shift;UI.sel=null;return render();
    case 'shiftline':return shiftLine(+i);
    case 'pick':{if(+i>=0)addCard(G.reward[+i]);G.fight++;G.screen='rest';return render()}
    case 'heal':G.hp=Math.min(G.maxHp,G.hp+18);return startCombat();
    case 'cult':G.screen='cult';UI.cult=null;UI.cultLine=null;return render();
    case 'cultback':G.screen='rest';return render();
    case 'csel':UI.cult=+i;UI.cultLine=null;return render();
    case 'cline':UI.cultLine=+i;return render();
    case 'cultok':{const d=G.deck.find(x=>x.uid===UI.cult);d.hex=NUM[BITS[d.hex]^(1<<UI.cultLine)];d.cult=true;return startCombat()}
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ln.tap')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}
});
render();
</script>
