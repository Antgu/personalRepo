<title>Changing Lines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one portrait column. A painted duel scene on top (foe far right, hero near left, Pokémon-style),
   then the stance strip, the preview, and a hand of rice-paper technique slips with ink-wash art. */
:root{
  --ink:#10121a; --panel:#181b25; --panel2:#212533; --rule:#2d3242;
  --fg:#ebe4d4; --mute:#8f94a6;
  --paper:#e9e0cb; --paper-ink:#221e18; --paper-mute:#6c6555;
  --cin:#cc4a30; --gold:#cfa64a; --jade:#4fae8f; --azure:#7097dc; --plum:#8c7699; --stone:#7d8394;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-brush:'Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.3;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:560px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;display:flex;flex-direction:column;gap:9px}
.zh{font-family:var(--f-brush);font-weight:400}
.mute{color:var(--mute)}
.btn{background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:9px 14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:15px}
.btn:hover{border-color:var(--mute)}
.btn{white-space:nowrap}
.btn.primary{background:var(--cin);border-color:var(--cin);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--gold);color:var(--gold)}

/* hexagram lines */
.hex{--w:34px;--h:4px;display:flex;flex-direction:column;gap:calc(var(--h)*.6);width:var(--w);color:inherit;flex:none}
.hex .ln{display:flex;gap:calc(var(--w)*.18);height:var(--h)}
.hex .ln i{flex:1;background:currentColor;border-radius:1px;transition:background .2s}
.hex.big{--w:100px;--h:11px;color:var(--fg)}
.hex.mid{--w:58px;--h:6px}
.hex.sm{--w:22px;--h:2.5px}
.hex.xs{--w:16px;--h:2px}
.hex .ln.chg i{background:var(--tc,var(--gold));box-shadow:0 0 10px var(--tc,var(--gold));animation:pulse 1s ease-in-out infinite alternate}
.hex .ln.flip i{animation:flip .55s ease-out}
.hex .ln.tap{cursor:pointer;padding-block:3px;margin-block:-3px}
.hex .ln.tap:hover i{background:var(--gold)}
.hex .ln.pick i{background:var(--jade)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes flip{0%{transform:scaleX(.2);background:var(--gold)}100%{transform:scaleX(1)}}

/* top bar */
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px}
.road{display:flex;gap:4px;align-items:center}
.road span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule);font-size:13px;color:var(--mute)}
.road span.now{border-color:var(--gold);color:var(--gold)}
.road span.done{background:var(--panel2);color:var(--fg)}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--rule);border-radius:6px;padding:3px 7px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.taels{font-size:14px;color:var(--gold);white-space:nowrap}

/* arena */
.arena{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--rule);background:#222}
.arena .bg{position:absolute;inset:0}
.arena .bg svg{width:100%;height:100%;display:block}
.sprite{position:absolute;pointer-events:none}
.sprite svg{width:100%;height:auto;display:block;overflow:visible}
.sprite.foe{right:5%;top:4%;width:29%}
.sprite.foe svg{transform:scaleX(-1)}
.sprite.hero{left:3%;top:40%;width:34%}
.fig .body{transform-origin:60px 150px;animation:breathe 2.6s ease-in-out infinite}
.fig .tail{transform-origin:50px 90px;animation:sway 2.2s ease-in-out infinite alternate}
@keyframes breathe{50%{transform:scaleY(.982) translateY(1px)}}
@keyframes sway{to{transform:rotate(7deg)}}
.sprite.hero.lunge{animation:lungeR .45s ease-out}
.sprite.foe.lunge{animation:lungeL .45s ease-out}
.sprite.hit{animation:hit .4s}
@keyframes lungeR{40%{transform:translate(28%,-10%)}}
@keyframes lungeL{40%{transform:translate(-40%,22%)}}
@keyframes hit{0%,100%{filter:none;transform:none}20%{filter:brightness(2.2) saturate(.2);transform:translateX(-5px)}50%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.slash{position:absolute;left:10%;top:30%;width:90%;height:5px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:rotate(-35deg);animation:slash .35s ease-out forwards;box-shadow:0 0 10px #fff}
@keyframes slash{from{opacity:1;transform:rotate(-35deg) scaleX(.1)}to{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
.info{position:absolute;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:8px 2px 8px 2px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(2px);font-size:13px}
.info.foebox{left:3%;top:3%;width:58%}
.info.herobox{right:3%;bottom:4%;width:52%}
.info .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.info .nm b{font-size:16px;line-height:1.1}
.info .nm small{color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hpb{display:flex;align-items:center;gap:6px}
.hpb .bar{flex:1}
.hpb span{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.intent{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px}
.intent .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.intent.cut .w{text-decoration:line-through;text-decoration-color:var(--jade)}
.fst{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.fst .zh{font-size:14px;color:var(--fg)}
.fst b{color:var(--jade);font-weight:600}

/* bars */
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--cin);transition:width .35s}
.bar.me b{background:var(--jade)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:0 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--rule);white-space:nowrap}
.chip.blk{color:var(--azure)}.chip.str{color:var(--cin)}.chip.burn{color:#e7863a}.chip.good{color:var(--jade)}.chip.gold{color:var(--gold)}

/* stance strip */
.stance{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.stance .mid{display:flex;align-items:center;gap:8px}
.stance .name{line-height:1.05}
.stance .name .zh{font-size:24px}
.stance .name small{display:block;color:var(--mute);font-size:12px}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.qi{display:flex;gap:4px}
.qi i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gold)}
.qi i.f{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.mom{font-size:14px;white-space:nowrap}
.mom .zh{font-size:24px;color:var(--cin);vertical-align:-3px}
.mom b{font-size:22px}
.stat-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.balance{display:flex;align-items:center;gap:5px;width:100%}
.balance .zh{font-size:15px}
.balance .track{flex:1;min-width:40px;height:7px;border-radius:4px;position:relative;background:linear-gradient(90deg,var(--cin) 0 12%,var(--panel2) 12% 88%,var(--cin) 88%)}
.balance .track::after{content:"";position:absolute;left:41%;width:18%;top:0;bottom:0;background:color-mix(in srgb,var(--jade) 40%,transparent)}
.balance .mark{position:absolute;top:-4px;width:4px;height:15px;background:var(--fg);border-radius:2px;transform:translateX(-50%);transition:left .3s;z-index:1}
.piles{font-size:12px;color:var(--mute)}

/* preview */
.preview{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:9px 10px;min-height:104px;display:flex;gap:10px}
.preview .hint{color:var(--mute);font-size:15px;margin:auto 0}
.preview .pvart{flex:0 0 92px}
.preview .pvart svg{width:92px;border-radius:4px;display:block}
.pv{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pv-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pv-head b{font-size:18px;line-height:1.1}
.pv-head .hx{color:var(--mute);font-size:13px}
.pv-head .hx .zh{color:var(--fg);font-size:15px}
.pv-text{font-size:14px}
.tr{font-size:13px;font-weight:600;color:var(--tc)}
.tr span{font-weight:400;color:var(--fg)}
.pv-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
.extra{font-size:13px;color:var(--jade)}
.t-flow{--tc:var(--jade)}.t-step{--tc:var(--stone)}.t-break{--tc:var(--plum)}.t-still{--tc:var(--gold)}.t-mirror{--tc:var(--azure)}.t-rev{--tc:var(--cin)}

/* hand */
.hand{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:thin}
.hand.withnext{padding-bottom:14px}
.card .next{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--tc);border:1.5px solid var(--ink);border-radius:4px;padding:0 4px;white-space:nowrap;z-index:1}
.card .next.no{opacity:.55;text-decoration:line-through}
.card{flex:0 0 calc((100% - 28px)/5);min-width:62px;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:3px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border:2px solid transparent;transition:transform .15s;box-shadow:0 2px 6px #0006}
.card .art{width:100%;display:block;border-radius:3px}
.card.sel{border-color:var(--gold);transform:translateY(-8px)}
.card.na{opacity:.5}
.card.temp{background:#f2dba6}
.card.sig{background:#dfe5e4}
.card .cost{position:absolute;top:-8px;left:-6px;width:21px;height:21px;border-radius:50%;background:var(--cin);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;border:2px solid var(--ink);z-index:1}
.card .cost.down{background:var(--jade)}.card .cost.up{background:var(--plum)}
.card .badge{position:absolute;top:-7px;right:-4px;font-size:9px;letter-spacing:.05em;padding:1px 3px;border-radius:3px;color:#fff;background:var(--tc);font-weight:700;z-index:1}
.card .nm{font-size:12px;font-weight:600;line-height:1.05;text-align:center;min-height:2.1em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .hn{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--paper-mute)}
.card .hn .zh{font-size:12px;color:var(--paper-ink)}

.actions{display:flex;gap:8px;align-items:center}
.pouch{flex:1;display:flex;gap:6px;justify-content:center}
.itm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:1.5px solid var(--ic,var(--gold));color:var(--ic,var(--gold));background:var(--panel2)}
.itm.sel{background:var(--ic,var(--gold));color:var(--ink)}
.itm.empty{border-style:dashed;opacity:.3}
.itm.big{width:46px;height:46px;font-size:26px}

/* big card (reward, deck, cultivate) */
.bigcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bigcard{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:6px 6px 10px;display:flex;flex-direction:column;gap:5px;text-align:left;border:2px solid transparent;position:relative}
.bigcard .art{width:100%;display:block;border-radius:5px}
button.bigcard:hover{border-color:var(--gold)}
.bigcard.sel{border-color:var(--jade)}
.bigcard.sig{background:#dfe5e4}
.bigcard .body{padding:0 4px;display:flex;flex-direction:column;gap:4px}
.bigcard .row{display:flex;gap:8px;align-items:center}
.bigcard b{font-size:17px;line-height:1.1}
.bigcard .hn{font-size:12px;color:var(--paper-mute)}
.bigcard .hn .zh{font-size:15px;color:var(--paper-ink)}
.bigcard p{margin:0;font-size:14px}
.bigcard .links{font-size:12px;color:var(--paper-mute);border-top:1px solid #cfc4ab;padding-top:4px}
.bigcard .cost{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:50%;background:var(--cin);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--paper)}
.bigcard .tag{position:absolute;top:10px;right:10px;font-size:10px;padding:1px 5px;border-radius:3px;background:var(--paper-ink);color:var(--paper);letter-spacing:.06em;text-transform:uppercase}

/* screens */
.screen{display:flex;flex-direction:column;gap:14px;padding-block:6px}
.screen h1{font-size:34px;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-wrap:balance}
.screen h2{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.screen h3{font-size:17px;margin:0;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.screen p{margin:0;font-size:16px;max-width:62ch}
.seal{width:84px;height:84px;background:var(--cin);color:#f6ead9;display:grid;place-items:center;font-size:52px;border-radius:6px;transform:rotate(-3deg);box-shadow:inset 0 0 0 4px var(--cin),inset 0 0 0 6px #f6ead955;flex:none}
.titlehead{display:flex;gap:16px;align-items:center}
.hero-card{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
.hero-card .bg{position:absolute;inset:0}.hero-card .bg svg{width:100%;height:100%;display:block}
.hero-card .sprite.hero{left:8%;top:12%;width:30%}
.hero-card .sprite.foe{right:8%;top:8%;width:24%}
.rules{display:grid;gap:8px;padding-left:20px;margin:0}
.rules li{font-size:15px}
.note{background:var(--panel);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px;font-size:15px}
.choice{display:grid;gap:10px}
.choice .btn{text-align:left;text-transform:none;font-size:17px;padding:14px;letter-spacing:0}
.choice .btn small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.cultbox{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cultbox .info2{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.cultbox .hex.big{--w:120px;--h:13px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wtile{background:var(--panel);border:1.5px solid var(--rule);border-radius:10px;padding:6px 6px 10px;display:flex;flex-direction:column;gap:5px;text-align:left}
.wtile .art{width:100%;display:block;border-radius:6px}
.wtile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.wtile .t{display:flex;align-items:baseline;gap:6px;padding:0 4px}
.wtile .t b{font-size:17px}
.wtile .t .zh{font-size:20px;color:var(--gold)}
.wtile p{margin:0;font-size:14px;padding:0 4px}
.wtile small{color:var(--mute);font-size:13px;padding:0 4px}
.itemrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.itemrow .d{flex:1;min-width:0}
.itemrow .d b{display:block}
.itemrow .d span{font-size:14px;color:var(--mute)}
.spoils{display:flex;gap:10px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 80%,transparent);z-index:20;display:flex;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;max-width:560px;width:100%;height:max-content;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:22px}
.modal h4{margin:6px 0 0;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.modal p{margin:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--rule);padding:6px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.form{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:8px;padding:10px}
.form .seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form .step{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.form .step .zh{font-size:16px}
.form.done{outline:1px solid var(--gold)}
.bagtop{display:flex;gap:12px;align-items:center}
.tabs{display:flex;gap:6px}
.tabs .btn{flex:1}
.mapstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.mapstats div{background:var(--panel2);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--mute)}
.mapstats b{display:block;font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
.mapgrid{display:grid;grid-template-columns:18px repeat(8,minmax(0,1fr));gap:5px;align-items:center}
.mapgrid .hd{font-size:15px;text-align:center;color:var(--mute);line-height:1}
.mc{position:relative;aspect-ratio:1;border-radius:5px;background:var(--panel2);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0}
.mc .hex{color:#5b6070}
.mc .no{font-size:10px;color:#5b6070;line-height:1;font-variant-numeric:tabular-nums}
.mc.has{background:var(--paper);color:var(--paper-ink)}
.mc.has .hex{color:var(--paper-ink)}.mc.has .no{color:var(--paper-mute)}
.mc .ct{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--cin);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px;z-index:2}
.mc.lr::after{content:"";position:absolute;right:-6.5px;top:50%;width:6px;height:3px;margin-top:-1.5px;background:var(--jade);z-index:1}
.mc.ld::before{content:"";position:absolute;bottom:-6.5px;left:50%;height:6px;width:3px;margin-left:-1.5px;background:var(--jade);z-index:1}
.mc.nb{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade)}
.mc.rv{border-color:var(--cin);box-shadow:0 0 0 1px var(--cin)}
.mc.mr{border-color:var(--azure);box-shadow:0 0 0 1px var(--azure)}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);transform:scale(1.08);z-index:3}
.mc.cand{outline:2px dashed var(--gold);outline-offset:1px}
.mc.stance .no{color:var(--cin);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid var(--c);margin-right:4px;vertical-align:-1px}
.mapdetail{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mapdetail .nbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.nbtn{display:flex;gap:6px;align-items:center;text-align:left;padding:4px 6px;border-radius:5px;border:1px solid var(--rule);font-size:13px}
.nbtn.off{opacity:.5}
.nbtn .k{color:var(--tc);font-weight:600;white-space:nowrap}
.nbtn .c{margin-left:auto;font-weight:700;color:var(--gold)}
.bagtop .mini{width:96px;flex:none}
.bagtop .mini svg{width:100%;overflow:visible}

.fl{position:fixed;pointer-events:none;font-weight:700;font-size:21px;z-index:30;animation:rise 1.1s ease-out forwards;text-shadow:0 2px 4px #000;white-space:nowrap;transform:translateX(-50%)}
.fl.dmg{color:#ff7a5c}.fl.blk{color:var(--azure)}.fl.good{color:var(--jade)}.fl.gold{color:var(--gold)}.fl.big{font-size:27px}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}

let artN=0;
function art(motif,hex,cls='art'){
  const b=BITS[hex],lo=b&7,up=b>>3,id='ga'+(++artN);
  const m=MOTIF[motif]?MOTIF[motif]():(W[motif]||'');
  const seal=(hz(hex)||'')[0];
  return `<svg class="${cls}" viewBox="0 0 100 72" aria-hidden="true"><defs>
  <linearGradient id="${id}u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TCOL[up]}" stop-opacity=".42"/><stop offset=".6" stop-color="${TCOL[up]}" stop-opacity="0"/></linearGradient>
  <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="${TCOL[lo]}" stop-opacity="0"/><stop offset="1" stop-color="${TCOL[lo]}" stop-opacity=".45"/></linearGradient></defs>
  <rect width="100" height="72" fill="#e2cd9f"/>
  <rect width="100" height="72" fill="url(#${id}u)"/><rect width="100" height="72" fill="url(#${id}l)"/>
  <rect width="100" height="72" filter="url(#cl-silk)" opacity=".22"/>
  <path d="${FAR[up%3]}" fill="#2a2620" opacity=".2" filter="url(#cl-wash)"/>
  <rect x="-5" y="38" width="110" height="10" fill="#f2e6c8" opacity=".55" filter="url(#cl-wash)"/>
  <g opacity=".42" fill="${INK}" stroke="${INK}" filter="url(#cl-brush)">${HORIZON[lo]}</g>
  <g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#cl-brush)" opacity=".93">${m}</g>
  <rect width="100" height="72" fill="url(#cl-vig)"/>
  <rect x="1.5" y="1.5" width="97" height="69" fill="none" stroke="#5e4630" stroke-opacity=".4" stroke-width=".7"/>
  <g transform="translate(86 58)" opacity=".88"><rect width="10" height="10" rx="1" fill="#b0302a"/><text x="5" y="8" font-size="8" text-anchor="middle" fill="#f3e6cc" font-family="Ma Shan Zheng,KaiTi,STKaiti,serif">${seal}</text></g></svg>`;
}

/* ======================= Transitions ======================= */
function classify(a,b){
  const d=a^b,n=pop(d);
  if(n===0)return{type:'still',n};
  if(b===(a^63))return{type:'reversal',n,mirror:b===rev(a)};
  if(b===rev(a))return{type:'mirror',n};
  if(n===1){const line=Math.log2(d);return{type:'flow',n,line,dir:(b>>line&1)?'hard':'soft'}}
  if(n===2)return{type:'step',n};
  return{type:'break',n};
}
const REGION=l=>l<2?'Earth':l<4?'Human':'Heaven';
function lineFx(line,dir){
  const r=REGION(line),adv=G&&G.bag.weapon==='spear'?5:3;
  if(r==='Earth')return dir==='hard'?{name:'Advance',desc:`next attack +${adv}`}:{name:'Sidestep',desc:'dodge the next hit'};
  if(r==='Human')return dir==='hard'?{name:'Rooted Strength',desc:'+1 Strength this turn'}:{name:'Yielding Guard',desc:'+4 Block'};
  return dir==='hard'?{name:'Surge',desc:'+1 Qi'}:{name:'Insight',desc:'draw 1'};
}
function revMult(card){const k=card&&CARDS[card.id].revBonus?2:1;return 1+G.c.momentum*k+(G.bag.weapon==='dao'?1:0)}
function trInfo(tr,card){
  const mom=G.c?G.c.momentum:0;
  switch(tr.type){
    case 'flow':{const fx=lineFx(tr.line,tr.dir);return{cls:'t-flow',short:'FLOW',label:`Flow · line ${tr.line+1} ${tr.dir==='hard'?'turns yang':'turns yin'}`,desc:` −1 Qi, +1 Momentum, ${fx.name}: ${fx.desc}`}}
    case 'step':return{cls:'t-step',short:'STEP',label:'Step · 2 lines change',desc:' normal play, Momentum kept'};
    case 'break':return{cls:'t-break',short:'BREAK',label:`Broken rhythm · ${tr.n} lines change`,desc:' +1 Qi cost, Momentum lost'};
    case 'still':return{cls:'t-still',short:'STILL',label:'Stillness · same hexagram',desc:' ×1.5 potency, Momentum kept'};
    case 'mirror':return{cls:'t-mirror',short:'MIRROR',label:'Mirror · your stance upside down',desc:' counter the next attack against you'};
    case 'reversal':return{cls:'t-rev',short:'REVERSE',label:'Reversal · every line flips'+(tr.mirror?' (and Mirror)':''),desc:` spends ${mom} Momentum for ×${revMult(card)} potency`+(tr.mirror?', counter next attack':'')};
  }
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let floats=[];
function fl(target,text,cls=''){floats.push({target,text,cls})}
const maxHp=()=>G.baseMax+(G.bag.charm==='jade'?10:0);

function newGame(weapon){
  G={screen:'combat',hp:64,baseMax:64,deck:[],fight:0,mastered:new Set(),uid:0,notes:[],reward:null,taels:20,shop:[],
     bag:{weapons:[weapon],weapon,charms:[],charm:null,items:['balm','qipill']}};
  STARTER.forEach(id=>addCard(id));
  startCombat();
}
function addCard(id,extra={}){G.deck.push(Object.assign({uid:++G.uid,id,hex:CARDS[id].hex},extra))}
const costOf=inst=>inst.cost!=null?inst.cost:CARDS[inst.id].cost;
function combatDeck(){
  const d=G.deck.map(x=>({...x})),w=WEAPONS[G.bag.weapon];
  if(w){for(let k=0;k<2;k++)d.push({uid:'w'+k,id:w.sig,hex:CARDS[w.sig].hex,sig:true})}
  return d;
}
function startCombat(){
  const f=FOES[G.fight];
  G.c={draw:shuffle(combatDeck()),hand:[],discard:[],exhaust:[],qi:3,stance:BITS[2],momentum:0,balance:0,block:0,str:0,tempStr:0,advance:0,sidestep:false,counter:false,burn:0,shiftUsed:false,hookUsed:false,history:[2],formsTurn:new Set(),formsDone:new Set(),log:'You take the Receptive stance and bow. The duel begins.',lastMask:0,busy:false,turn:0,anim:[],
    foe:{...f,hp:f.hp,max:f.hp,block:0,str:0,burn:G.bag.charm==='lantern'?4:0,mi:0,interrupted:false}};
  G.screen='combat';UI.sel=null;UI.item=null;UI.shift=false;UI.modal=null;
  startTurn();
}
const curMove=()=>{const f=G.c.foe;return f.moves[f.mi%f.moves.length]};
function draw(n){
  const c=G.c;
  for(let i=0;i<n;i++){
    if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}
    if(c.hand.length>=10)break;
    c.hand.push(c.draw.pop());
  }
}
function startTurn(){
  const c=G.c;c.turn++;c.block=0;c.tempStr=0;c.counter=false;c.sidestep=false;c.hookUsed=false;c.formsTurn=new Set();
  const notes=[];
  if(c.burn>0){selfHurt(c.burn,'Burn');c.burn--}
  if(Math.abs(c.balance)>=9){selfHurt(3);c.tempStr+=2;notes.push('Qi Deviation: −3 HP, +2 Strength this turn');fl('me','Qi Deviation','dmg')}
  else if(c.turn>1&&Math.abs(c.balance)<=2){const v=G.bag.charm==='shell'?7:3;c.block+=v;notes.push(`Harmony: +${v} Block`);fl('me',`Harmony +${v}`,'blk')}
  c.balance=c.balance>0?Math.max(0,c.balance-2):Math.min(0,c.balance+2);
  c.qi=3;c.shiftUsed=false;c.foe.interrupted=false;
  draw(G.bag.weapon==='fists'?6:5);
  if(notes.length)c.log=notes.join(' · ');
  render();
  if(G.hp<=0)return lose();
}

/* ======================= Effects ======================= */
function A(x,base,hits=1,pierce=false){
  const c=G.c;c.anim.push('heroLunge');
  for(let i=0;i<hits;i++){
    let d=base+c.str+c.tempStr+c.momentum;
    if(c.advance){d+=c.advance;c.advance=0}
    d=Math.max(0,Math.floor(d*x.mult));
    hitFoe(d,pierce);
    if(c.foe.hp<=0)break;
  }
}
function B(x,n){const v=Math.floor(n*x.mult);G.c.block+=v;fl('me','+'+v+' Block','blk')}
function hitFoe(d,pierce,tag){
  const f=G.c.foe;
  if(!pierce&&f.block){const a=Math.min(f.block,d);f.block-=a;d-=a}
  f.hp=Math.max(0,f.hp-d);fl('foe',(tag?tag+' ':'')+'−'+d,'dmg big');G.c.anim.push('foeHit');
}
function selfHurt(d,tag){G.hp=Math.max(0,G.hp-d);fl('me',(tag?tag+' ':'')+'−'+d,'dmg');if(G.c)G.c.anim.push('heroHit')}
function hurtMe(d){
  const c=G.c;
  if(c.counter){c.counter=false;fl('me','Countered!','gold');hitFoe(d*(G.bag.weapon==='fan'?2:1),true,'Reflected');return}
  if(c.sidestep){c.sidestep=false;fl('me','Sidestep','good');return}
  if(c.block){const a=Math.min(c.block,d);c.block-=a;d-=a}
  if(d>0)selfHurt(d);else fl('me','Blocked','blk');
}

/* ======================= Player actions ======================= */
function effCost(inst,tr){const b=costOf(inst);if(tr.type==='flow')return Math.max(0,b-1);if(tr.type==='break')return b+1;return b}
function play(idx){
  const c=G.c;if(c.busy)return;
  const inst=c.hand[idx],def=CARDS[inst.id],bits=BITS[inst.hex];
  const tr=classify(c.stance,bits),cost=effCost(inst,tr);
  if(c.qi<cost)return;
  c.qi-=cost;c.hand.splice(idx,1);UI.sel=null;
  const x={mult:1,tr,inst,momBefore:c.momentum};
  const msgs=[`${def.name}: ${trInfo(tr,inst).short.toLowerCase()}`];
  const wp=G.bag.weapon;
  if(tr.type==='flow'){
    c.momentum++;const fx=lineFx(tr.line,tr.dir);msgs.push(fx.name);
    if(fx.name==='Advance')c.advance+=wp==='spear'?5:3;else if(fx.name==='Sidestep')c.sidestep=true;
    else if(fx.name==='Rooted Strength')c.tempStr++;else if(fx.name==='Yielding Guard'){c.block+=4;fl('me','+4 Block','blk')}
    else if(fx.name==='Surge')c.qi++;else draw(1);
    const reg=REGION(tr.line);
    if(wp==='jian'&&reg==='Heaven'){hitFoe(3,false,'Sword');msgs.push('sword +3')}
    if(wp==='staff'&&reg==='Earth'){c.block+=3;fl('me','+3 Block','blk')}
    if(wp==='hooks'&&!c.hookUsed){c.hookUsed=true;c.qi++;msgs.push('hooks +1 Qi')}
  }else if(tr.type==='break')c.momentum=0;
  else if(tr.type==='still')x.mult=1.5;
  else if(tr.type==='mirror'){c.counter=true;msgs.push('counter ready');if(G.bag.charm==='bagua')draw(1)}
  else if(tr.type==='reversal'){x.mult=revMult(inst);msgs.push('×'+x.mult);if(x.mult>1)fl('me','×'+x.mult,'gold big');c.momentum=0;if(tr.mirror){c.counter=true;if(G.bag.charm==='bagua')draw(1)}}
  const fb=BITS[curMove().hex];
  if(bits===(fb^63)&&!c.foe.interrupted){c.foe.interrupted=true;msgs.push('Interrupt!');fl('foe','Interrupted','good')}
  def.play(x);
  c.balance=Math.max(-12,Math.min(12,c.balance+pop(bits)-3));
  c.lastMask=c.stance^bits;c.stance=bits;c.history.push(inst.hex);
  checkForms(msgs);
  (def.exhaust||inst.temp?c.exhaust:c.discard).push(inst);
  c.log=msgs.join(' · ');
  render();checkEnd();
}
function shiftLine(i){
  const c=G.c;if(c.qi<1||c.shiftUsed||c.busy)return;
  c.qi--;c.shiftUsed=true;UI.shift=false;
  c.lastMask=1<<i;c.stance^=1<<i;c.history.push(NUM[c.stance]);
  c.balance=Math.max(-12,Math.min(12,c.balance+((c.stance>>i&1)?1:-1)));
  const msgs=[`Shift: stance becomes ${hz(NUM[c.stance])} ${he(NUM[c.stance])}`];
  checkForms(msgs);c.log=msgs.join(' · ');render();
}
function checkForms(msgs){
  const c=G.c,h=c.history;
  for(const f of FORMS){
    if(c.formsTurn.has(f.id)||h.length<3)continue;
    if(h.slice(-3).every((n,i)=>n===f.seq[i])){
      c.formsTurn.add(f.id);c.formsDone.add(f.id);
      c.hand.push({uid:'t'+Math.random(),id:f.card,hex:CARDS[f.card].hex,temp:true,cost:0});
      msgs.push(`Form performed: ${f.name}!`);fl('me',f.name+'!','gold big');
    }
  }
}
function useItem(idx){
  const id=G.bag.items[idx],it=CONSUM[id],c=G.c,inCombat=G.screen==='combat';
  if(!it||(it.combat&&!inCombat)||(inCombat&&c.busy))return;
  G.bag.items.splice(idx,1);UI.item=null;
  if(id==='balm'){G.hp=Math.min(maxHp(),G.hp+14);if(inCombat)fl('me','+14 HP','good')}
  if(id==='qipill'){c.qi+=2;fl('me','+2 Qi','gold')}
  if(id==='talisman'){c.anim.push('heroLunge');hitFoe(10,true,'Talisman')}
  if(id==='incense'){c.balance=0;c.momentum++;fl('me','Clarity','good')}
  if(inCombat){c.log=`Used ${it.name}.`;render();checkEnd()}else{render()}
}
function endTurn(){
  const c=G.c;if(c.busy)return;c.busy=true;UI.sel=null;UI.item=null;UI.shift=false;
  c.hand.forEach(x=>(x.temp?c.exhaust:c.discard).push(x));c.hand=[];
  render();setTimeout(foeTurn,450);
}
function foeTurn(){
  const c=G.c,f=c.foe;
  if(f.burn>0){hitFoe(f.burn,true,'Burn');f.burn--;if(f.hp<=0){render();return checkEnd()}}
  f.block=0;
  const m=curMove(),k=f.interrupted?0.5:1,h=v=>Math.floor(v*k);
  const atk=(v,hits=1)=>{c.anim.push('foeLunge');for(let i=0;i<hits;i++)hurtMe(Math.max(0,h(v)+f.str))};
  if(m.t==='atk')atk(m.v,m.hits||1);
  else if(m.t==='blkatk'){f.block+=h(m.b);atk(m.v)}
  else if(m.t==='buff'){f.str+=h(m.s);fl('foe',`+${h(m.s)} Strength`,'gold')}
  else if(m.t==='blkbuff'){f.block+=h(m.b);f.str+=h(m.s);fl('foe',`+${h(m.b)} Block`,'blk')}
  else if(m.t==='burnatk'){c.burn+=h(m.burn);atk(m.v)}
  c.log=`${f.name}: ${intentText(m,f)}${f.interrupted?' (interrupted, halved)':''}.`;
  f.mi++;
  render();
  if(f.hp<=0){c.busy=false;return checkEnd()}
  if(G.hp<=0)return lose();
  setTimeout(()=>{c.busy=false;startTurn()},650);
}
function intentText(m,f){
  const s=f?f.str:0,v=x=>Math.max(0,x+s);
  switch(m.t){
    case 'atk':return m.hits>1?`Attack ${v(m.v)}×${m.hits}`:`Attack ${v(m.v)}`;
    case 'blkatk':return `Block ${m.b} · Attack ${v(m.v)}`;
    case 'buff':return `Gather strength +${m.s}`;
    case 'blkbuff':return `Block ${m.b} · Strength +${m.s}`;
    case 'burnatk':return `Burn ${m.burn} · Attack ${v(m.v)}`;
  }
}
const intentIcon=m=>m.t==='atk'||m.t==='blkatk'||m.t==='burnatk'?'⚔':m.t==='buff'?'▲':'◆';
function checkEnd(){
  const c=G.c;
  if(c.foe.hp<=0&&!c.won){c.won=true;c.busy=true;setTimeout(win,800)}
  else if(G.hp<=0)lose();
}
function grant(kind,id){
  const b=G.bag;
  if(kind==='weapon'&&!b.weapons.includes(id)){b.weapons.push(id);return `Weapon: ${WEAPONS[id].name}`}
  if(kind==='charm'&&!b.charms.includes(id)){b.charms.push(id);return `Talisman: ${CHARMS[id].name}`}
  if(kind==='item'){if(b.items.length<3){b.items.push(id);return `Pouch: ${CONSUM[id].name}`}G.taels+=10;return `Pouch full: ${CONSUM[id].name} sold for 10 taels`}
  return null;
}
function win(){
  const c=G.c,f=c.foe;G.notes=[];G.spoils=[];
  for(const id of c.formsDone){
    if(!G.mastered.has(id)){const fm=FORMS.find(x=>x.id===id);G.mastered.add(id);addCard(fm.card);G.notes.push(`Form mastered: ${fm.name}. ${CARDS[fm.card].name} joins your deck.`)}
  }
  if(f.boss){G.screen='victory';return render()}
  G.taels+=f.taels;G.spoils.push({glyph:'兩',col:'#cfa64a',text:`${f.taels} taels of silver`});
  if(f.drop){const t=grant(f.drop.kind,f.drop.id);const src=f.drop.kind==='weapon'?WEAPONS[f.drop.id]:CHARMS[f.drop.id];if(t)G.spoils.push({glyph:src.zh,col:src.col||'#cfa64a',text:t})}
  const cid=shuffle(Object.keys(CONSUM))[0];const t=grant('item',cid);G.spoils.push({glyph:CONSUM[cid].zh,col:CONSUM[cid].col,text:t});
  G.reward=shuffle(POOL.slice()).slice(0,3);G.screen='reward';render();
}
function lose(){if(G.screen==='dead')return;G.screen='dead';render()}
function makeShop(){
  const opts=[...Object.keys(CONSUM).map(id=>({kind:'item',id})),...Object.keys(CHARMS).filter(id=>!G.bag.charms.includes(id)&&id!=='lantern').map(id=>({kind:'charm',id}))];
  G.shop=shuffle(opts).slice(0,3).map(o=>({...o,sold:false}));
}

/* ======================= Deck links ======================= */
function links(bits,excludeUid){
  let flow=0,rv=0,mr=0;
  for(const d of G.deck){if(d.uid===excludeUid)continue;const b=BITS[d.hex];
    if(pop(b^bits)===1)flow++;else if(b===(bits^63))rv++;else if(b===rev(bits)&&b!==bits)mr++}
  return{flow,rv,mr};
}
const linksText=l=>`Links in deck: ${l.flow} flow · ${l.rv} reversal · ${l.mr} mirror`;

/* ======================= Map of Changes (deck explorer) ======================= */
const GRAY=[0,1,3,2,6,7,5,4]; // 3-bit Gray order: neighbours in the grid differ by one line
const TRIG={7:['☰','Heaven'],0:['☷','Earth'],1:['☳','Thunder'],2:['☵','Water'],4:['☶','Mountain'],6:['☴','Wind'],5:['☲','Fire'],3:['☱','Lake']};
function deckCounts(){
  const m=new Map(),w=WEAPONS[G.bag.weapon];
  const add=(hex,name,k=1)=>{const b=BITS[hex];if(!m.has(b))m.set(b,{n:0,cards:[]});const e=m.get(b);e.n+=k;e.cards.push(k>1?name+' ×'+k:name)};
  G.deck.forEach(d=>add(d.hex,CARDS[d.id].name));
  if(w)add(CARDS[w.sig].hex,CARDS[w.sig].name+' (weapon)',2);
  return m;
}
function mapStats(m){
  let cards=0,flow=0,rv=0,mr=0,iso=0;
  for(const[b,e]of m){cards+=e.n;let has=false;
    for(let i=0;i<6;i++){const o=m.get(b^(1<<i));if(o){has=true;if(b<(b^(1<<i)))flow+=e.n*o.n}}
    if(!has)iso+=e.n;
    const r=m.get(b^63);if(r&&b<(b^63))rv+=e.n*r.n;
    const q=rev(b);if(q!==b&&q!==(b^63)&&b<q&&m.get(q))mr+=e.n*m.get(q).n;}
  return{cards,distinct:m.size,flow,rv,mr,iso};
}
function renderMap(){
  const m=deckCounts(),st=mapStats(m),sel=UI.mapSel;
  const cand=G.screen==='reward'?new Set(G.reward.map(id=>BITS[CARDS[id].hex])):new Set();
  const stance=G.screen==='combat'?G.c.stance:null;
  let grid=`<span></span>`+GRAY.map(l=>`<span class="hd zh" title="Lower: ${TRIG[l][1]}">${TRIG[l][0]}</span>`).join('');
  GRAY.forEach((u,r)=>{
    grid+=`<span class="hd" title="Upper: ${TRIG[u][1]}">${TRIG[u][0]}</span>`;
    GRAY.forEach((l,c)=>{
      const b=l|(u<<3),e=m.get(b),k=[e?'has':''];
      if(e&&c<7&&m.has(GRAY[c+1]|(u<<3)))k.push('lr');
      if(e&&r<7&&m.has(l|(GRAY[r+1]<<3)))k.push('ld');
      if(sel!=null){if(b===sel)k.push('sel');else if(pop(b^sel)===1)k.push('nb');else if(b===(sel^63))k.push('rv');else if(b===rev(sel))k.push('mr')}
      if(cand.has(b))k.push('cand');if(b===stance)k.push('stance');
      grid+=`<button class="mc ${k.join(' ')}" data-act="msel" data-i="${b}" aria-label="${NUM[b]} ${he(NUM[b])}${e?', '+e.n+' in deck':''}">${hexHTML(b,'xs')}<span class="no">${NUM[b]}</span>${e?`<span class="ct">${e.n}</span>`:''}</button>`;
    });
  });
  let det='<div class="mapdetail mute">Tap a hexagram to see its six Flow neighbours, its Reversal and its Mirror.</div>';
  if(sel!=null){
    const e=m.get(sel),n=NUM[sel];
    const nb=(b,label,cls)=>{const o=m.get(b);return `<button class="nbtn ${cls} ${o?'':'off'}" data-act="msel" data-i="${b}">${hexHTML(b,'xs')}<span class="k">${label}</span><span><span class="zh">${hz(NUM[b])}</span> ${he(NUM[b])}</span><span class="c">${o?o.n:''}</span></button>`};
    const flows=[0,1,2,3,4,5].map(i=>{const b=sel^(1<<i),fx=lineFx(i,(b>>i&1)?'hard':'soft');return nb(b,`L${i+1} ${fx.name}`,'t-flow')}).join('');
    const q=rev(sel);
    det=`<div class="mapdetail"><div><b style="font-size:17px">${hexName(n)}</b> <span class="mute">· ${TRIG[sel>>3][1]} over ${TRIG[sel&7][1]}</span></div>
      <div>${e?'In deck: '+e.cards.join(', '):'<span class="mute">None of your techniques sit here.</span>'}${cand.has(sel)?' <span class="chip gold">Offered now</span>':''}</div>
      <div class="stat-label">Flow into (one line changes; the label is the line effect you get)</div><div class="nbs">${flows}</div>
      <div class="nbs">${nb(sel^63,'Reversal','t-rev')}${q!==sel&&q!==(sel^63)?nb(q,'Mirror','t-mirror'):''}</div></div>`;
  }
  return `<div class="mapstats">
      <div><b>${st.cards}</b>techniques</div><div><b>${st.distinct}</b>hexagrams used</div>
      <div><b>${st.flow}</b>flow pairs</div><div><b>${st.rv}</b>reversal pairs</div><div><b>${st.mr}</b>mirror pairs</div>
      <div><b style="color:${st.iso?'var(--cin)':'var(--jade)'}">${st.iso}</b>isolated (no flow partner)</div></div>
    <p class="mute" style="font-size:13px">Rows are the upper trigram, columns the lower. Cells side by side or above and below differ by one line, so each is a Flow (the grid wraps around at the edges). Green bridges join hexagrams you own that Flow into each other.${cand.size?' Dashed gold marks the techniques you are being offered.':''}${stance!=null?' Your current stance has a red number.':''}</p>
    <div class="mapgrid">${grid}</div>
    <div class="legend"><span><i style="--c:var(--gold)"></i>selected</span><span><i style="--c:var(--jade)"></i>flow</span><span><i style="--c:var(--cin)"></i>reversal</span><span><i style="--c:var(--azure)"></i>mirror</span></div>
    ${det}`;
}

/* ======================= Rendering ======================= */
function hexHTML(bits,cls='',o={}){
  let s=`<div class="hex ${cls}" ${o.style?`style="${o.style}"`:''} aria-label="Hexagram ${NUM[bits]} ${he(NUM[bits])}">`;
  for(let i=5;i>=0;i--){
    const y=bits>>i&1,k=[y?'yang':'yin'];
    if(o.chg&(1<<i))k.push('chg');if(o.flip&(1<<i))k.push('flip');if(o.tap)k.push('tap');if(o.pick===i)k.push('pick');
    s+=`<div class="ln ${k.join(' ')}" ${o.tap?`data-act="${o.tap}" data-i="${i}" role="button" tabindex="0" aria-label="Line ${i+1}"`:''}>${y?'<i></i>':'<i></i><i></i>'}</div>`;
  }
  return s+'</div>';
}
const hexName=n=>`<span class="zh">${hz(n)}</span> ${n} · ${he(n)}`;
const itemOrb=(zh,col,cls='')=>`<span class="itm ${cls}" style="--ic:${col}"><span class="zh">${zh}</span></span>`;

function render(){
  artN=0;
  const s=G?G.screen:'title';
  $app.innerHTML=s==='title'?renderTitle():s==='arms'?renderArms():s==='combat'?renderCombat():s==='reward'?renderReward():s==='rest'?renderRest():s==='cult'?renderCult():renderEnd();
  renderModal();
  if(G&&G.c&&s==='combat')applyAnim();
  flushFloats();
}
function applyAnim(){
  const c=G.c,a=new Set(c.anim);c.anim=[];c.lastMask=0;
  const hero=document.getElementById('heroSpr'),foe=document.getElementById('foeSpr');
  const run=(el,cls,delay=0)=>{if(!el)return;setTimeout(()=>{el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)},delay)};
  const slash=(el,delay)=>{if(!el)return;setTimeout(()=>{const s=document.createElement('div');s.className='slash';el.appendChild(s);setTimeout(()=>s.remove(),400)},delay)};
  if(a.has('heroLunge'))run(hero,'lunge');
  if(a.has('foeHit')){run(foe,'hit',a.has('heroLunge')?160:0);slash(foe,a.has('heroLunge')?160:0)}
  if(a.has('foeLunge'))run(foe,'lunge');
  if(a.has('heroHit')){run(hero,'hit',a.has('foeLunge')?170:0);slash(hero,a.has('foeLunge')?170:0)}
}
function flushFloats(){
  const list=floats;floats=[];
  list.forEach((f,i)=>{
    const el=document.getElementById(f.target==='foe'?'foeSpr':'heroSpr');if(!el)return;
    const r=el.getBoundingClientRect(),d=document.createElement('div');
    d.className='fl '+f.cls;d.textContent=f.text;
    d.style.left=(r.left+r.width/2+(i%3-1)*36)+'px';d.style.top=(r.top+r.height*.25+i*12)+'px';
    document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
  });
}

    body=`<h3>Your techniques (${G.deck.length}${w?' + 2 weapon':''})</h3>
    <div class="tabs"><button class="btn small ${tab==='cards'?'on':''}" data-act="dtab" data-i="cards">Cards</button><button class="btn small ${tab==='map'?'on':''}" data-act="dtab" data-i="map">Map of Changes</button></div>`+(tab==='map'?renderMap():`<div class="bigcards">${G.deck.map(d=>bigCard(d,{links:links(BITS[d.hex],d.uid)})).join('')}${w?bigCard({id:w.sig,hex:CARDS[w.sig].hex,sig:true}):''}</div>`)}
  else if(UI.modal==='bag')body=renderBag();
  $modal.innerHTML=`<div class="modal" data-act="close"><div class="sheet" data-stop="1">${body}<div><button class="btn" data-act="close">Close</button></div></div></div>`;
  $modal.querySelectorAll('.step svg.art').forEach(s=>s.style.width='84px');
}

/* ======================= Input ======================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.classList.contains('modal')&&e.target.closest('[data-stop]'))return;
  const act=el.dataset.act,i=el.dataset.i!=null?el.dataset.i:null;
  if(act.startsWith('m:')){UI.modal=act.slice(2);return renderModal()}
  switch(act){
    case 'close':UI.modal=null;return renderModal();
    case 'dtab':UI.deckTab=i;return renderModal();
    case 'msel':{const b=+i;UI.mapSel=UI.mapSel===b?null:b;const y=$modal.querySelector('.modal').scrollTop;renderModal();const mm=$modal.querySelector('.modal');if(mm)mm.scrollTop=y;return}
    case 'mapcmp':UI.modal='deck';UI.deckTab='map';UI.mapSel=BITS[CARDS[G.reward[0]].hex];return renderModal();
    case 'arms':UI.modal=null;G=null;UI.arm='jian';return renderArmsScreen();
    case 'arm':UI.arm=i;return renderArmsScreen();
    case 'go':return newGame(UI.arm);
    case 'sel':{const k=+i;if(G.c.busy)return;UI.shift=false;UI.item=null;if(UI.sel===k)return play(k);UI.sel=k;return render()}
    case 'play':if(UI.sel!=null)play(UI.sel);return;
    case 'item':{const k=+i;UI.sel=null;UI.shift=false;const id=G.bag.items[k];if(!CONSUM[id].combat&&id!=='balm')return;UI.item=UI.item===k?null:k;return render()}
    case 'use':if(UI.item!=null)useItem(UI.item);return;
    case 'bagUse':useItem(+i);UI.modal='bag';return render();
    case 'end':return endTurn();
    case 'shift':UI.shift=!UI.shift;UI.sel=null;UI.item=null;return render();
    case 'shiftline':return shiftLine(+i);
    case 'pick':{if(+i>=0)addCard(G.reward[+i]);G.fight++;makeShop();G.screen='rest';return render()}
    case 'heal':G.hp=Math.min(maxHp(),G.hp+18);return startCombat();
    case 'cult':G.screen='cult';UI.cult=null;UI.cultLine=null;return render();
    case 'cultback':G.screen='rest';return render();
    case 'csel':UI.cult=+i;UI.cultLine=null;return render();
    case 'cline':UI.cultLine=+i;return render();
    case 'cultok':{const d=G.deck.find(x=>x.uid===UI.cult);d.hex=NUM[BITS[d.hex]^(1<<UI.cultLine)];d.cult=true;return startCombat()}
    case 'equip':G.bag.weapon=i;return render();
    case 'charm':G.bag.charm=i||null;G.hp=Math.min(G.hp,maxHp());return render();
    case 'buy':{const s=G.shop[+i],it=s.kind==='item'?CONSUM[s.id]:CHARMS[s.id];if(s.sold||G.taels<it.price)return;G.taels-=it.price;grant(s.kind,s.id);s.sold=true;return render()}
  }
});
function renderArmsScreen(){$app.innerHTML=renderArms();renderModal()}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ln.tap')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}
});
render();
</script>
